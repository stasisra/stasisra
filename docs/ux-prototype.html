<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Темы и задачи — интерактивный макет</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --paper: #fff;
        --text: #202b3b;
        --muted: #7a8799;
        --line: #e7ebf2;
        --accent: #3569dc;
        --soft: #edf3ff;
        --green: #15936f;
        --red: #d45459;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 "Segoe UI",
          Arial,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #90b1ff;
        outline-offset: 2px;
      }
      button {
        color: inherit;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      input,
      select,
      textarea {
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 9px 11px;
        background: #fff;
        color: var(--text);
        min-width: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #b6cdff;
        border-color: var(--accent);
      }
      button svg {
        pointer-events: none;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .small-icon {
        width: 15px;
        height: 15px;
      }
      .topbar {
        height: 62px;
        display: flex;
        align-items: center;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 26px;
        gap: 38px;
      }
      .brand {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border-radius: 8px;
        color: white;
        background: var(--accent);
      }
      .topnav {
        display: flex;
        gap: 25px;
        height: 100%;
        align-items: center;
      }
      .topnav button {
        height: 100%;
        border: 0;
        background: none;
        color: var(--muted);
        position: relative;
        padding: 0 2px;
      }
      .topnav button.active {
        color: var(--accent);
        font-weight: 600;
      }
      .topnav button.active:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--accent);
        border-radius: 3px;
      }
      .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 700;
        background: #e9efff;
        color: #4a66a1;
      }
      .avatar.a1 {
        background: #f0eafe;
        color: #8d68ae;
      }
      .avatar.a2 {
        background: #e2f3ec;
        color: #3f8a70;
      }
      .avatar.a3 {
        background: #fff0e1;
        color: #a37b48;
      }
      .avatar.a4 {
        background: #e5f1f7;
        color: #477e9c;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .demo-bar {
        height: 34px;
        background: #f0f4fb;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c7c94;
        font-size: 11px;
        gap: 12px;
      }
      .demo-bar button {
        border: 0;
        background: none;
        color: #5879b0;
        text-decoration: underline;
        font-size: 11px;
      }
      .layout {
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        height: calc(100vh - 96px);
      }
      aside.sidebar {
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 24px 14px 14px;
        overflow: hidden;
      }
      .side-label {
        padding: 0 12px;
        margin-bottom: 10px;
        color: #8b97a8;
        font-size: 10px;
        letter-spacing: 1.4px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .side-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 24px 12px 9px;
        font-size: 10px;
        letter-spacing: 1.2px;
        color: #8b97a8;
        font-weight: 700;
      }
      .side-scroll {
        overflow: auto;
        flex: 1;
        margin-top: 2px;
      }
      .side-item {
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 10px;
        padding: 10px 12px;
        margin: 2px 0;
        border-radius: 8px;
        font-size: 12px;
        min-height: 39px;
      }
      .side-item:hover {
        background: #f6f8fc;
      }
      .side-item.selected {
        background: var(--soft);
        color: var(--accent);
        font-weight: 600;
      }
      .side-item .num {
        margin-left: auto;
        font-size: 11px;
        color: #99a3b4;
      }
      .side-item.selected .num {
        background: #dce8ff;
        color: var(--accent);
        padding: 1px 6px;
        border-radius: 5px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
        flex-shrink: 0;
        background: var(--dot, #a1b2cb);
      }
      .side-item .label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .side-foot {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .side-foot .hint {
        margin: 14px 12px 0;
        font-size: 10px;
        color: #a0aaba;
      }
      .tinybtn {
        border: 0;
        background: none;
        border-radius: 5px;
        padding: 2px 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #8592a7;
      }
      .tinybtn:hover {
        background: #edf2fb;
        color: var(--accent);
      }
      main {
        overflow: auto;
        padding: 29px 30px 50px;
      }
      .breadcrumb {
        font-size: 11px;
        color: #93a0b2;
        margin-bottom: 9px;
      }
      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .page-head h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.7px;
        font-weight: 650;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin: 7px 0 0;
      }
      .head-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-top: 3px;
      }
      .btn {
        padding: 9px 13px;
        border: 1px solid #dfe5ee;
        background: #fff;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
        font-size: 12px;
        white-space: nowrap;
      }
      .btn:hover {
        background: #f6f8fc;
      }
      .btn.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 2px 3px #295cc91a;
      }
      .btn.primary:hover {
        background: #285bcb;
      }
      .btn.danger {
        color: #c44f54;
        border-color: #f1d6d7;
      }
      .btn.danger:hover {
        background: #fff5f5;
      }
      .btn.soft {
        border: 0;
        background: #edf3ff;
        color: var(--accent);
      }
      .search {
        margin-top: 25px;
        display: flex;
        align-items: center;
        position: relative;
      }
      .search .icon {
        position: absolute;
        left: 13px;
        color: #8d9bb0;
      }
      .search input {
        width: 100%;
        padding: 11px 14px 11px 40px;
        font-size: 12px;
        background: #fff;
        box-shadow: 0 1px 3px #17284103;
      }
      .search .key {
        position: absolute;
        right: 11px;
        font-size: 10px;
        color: #a1abba;
        border: 1px solid #e6eaf2;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .filterbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        margin: 14px 0 12px;
      }
      .filterbar select {
        font-size: 11px;
        padding: 7px 28px 7px 10px;
        max-width: 220px;
        color: #536177;
      }
      .filterbar .label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #6f7e93;
        margin-left: 4px;
      }
      .filterbar input[type="checkbox"] {
        width: 13px;
        height: 13px;
        accent-color: var(--accent);
      }
      .filterbar .spacer {
        margin-left: auto;
      }
      .view-switch {
        display: flex;
        border: 1px solid #dfe5ed;
        padding: 2px;
        border-radius: 7px;
        background: #fff;
      }
      .view-switch button {
        padding: 5px 8px;
        border: 0;
        background: none;
        color: #8a96a8;
        border-radius: 4px;
        font-size: 11px;
      }
      .view-switch button.active {
        background: #edf2fb;
        color: #4e6da3;
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        font-size: 11px;
        min-height: 4px;
        margin-bottom: 12px;
      }
      .chip {
        background: #eaf1ff;
        border: 1px solid #dce8ff;
        padding: 4px 8px;
        border-radius: 5px;
        color: #4169ad;
      }
      .chip button {
        border: 0;
        background: none;
        color: #6b88bc;
        margin-left: 7px;
        padding: 0;
      }
      .textbtn {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 3px 1px;
        font-size: 11px;
      }
      .section {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        margin-bottom: 16px;
        box-shadow: 0 2px 4px #24375702;
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: #fcfdff;
      }
      .section-head h2 {
        font-size: 13px;
        margin: 0;
        font-weight: 650;
      }
      .section-head .count {
        font-size: 10px;
        color: #8794a8;
        padding: 1px 6px;
        border: 1px solid #e6ebf4;
        border-radius: 5px;
        background: #fff;
      }
      .section-head .section-hint {
        font-size: 10px;
        color: #9aa5b5;
      }
      .section-head .add {
        margin-left: auto;
      }
      .collapse {
        border: 0;
        background: none;
        color: #8493aa;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }
      .collapse .icon {
        width: 13px;
        height: 13px;
        transition: transform 0.15s;
      }
      .collapse.shut .icon {
        transform: rotate(-90deg);
      }
      .table-head,
      .task-row {
        display: grid;
        grid-template-columns:
          minmax(235px, 1fr)
          144px 142px 109px 94px 112px 30px;
        align-items: center;
        column-gap: 10px;
        padding: 0 15px;
      }
      .table-head {
        font-size: 10px;
        color: #96a1b2;
        height: 33px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .task-row {
        min-height: 55px;
        border-bottom: 1px solid #f0f2f7;
        font-size: 11px;
      }
      .task-row:last-child {
        border: 0;
      }
      .task-row:hover {
        background: #f9fbff;
      }
      .task-row.context {
        background: #fcfdff;
      }
      .task-cell {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        min-width: 0;
        padding: 10px 0;
      }
      .task-cell .task-icon {
        color: #a7b3c6;
        padding-top: 2px;
        flex-shrink: 0;
      }
      .task-cell .task-icon.event {
        color: #a58cc9;
      }
      .task-cell .arrow-holder {
        width: 16px;
        min-width: 16px;
        padding-top: 3px;
      }
      .task-label {
        min-width: 0;
      }
      .task-title {
        font-weight: 500;
        font-size: 12px;
        line-height: 1.4;
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        color: #34435b;
        max-width: 100%;
      }
      .task-title:hover {
        color: var(--accent);
      }
      .task-row.parent .task-title {
        font-weight: 650;
      }
      .task-row.context .task-title {
        color: #8c9ab0;
      }
      .task-desc {
        display: block;
        color: #99a4b6;
        font-size: 10px;
        margin-top: 3px;
        max-width: 290px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .child-count {
        font-size: 9px;
        color: #8b9bb6;
        background: #f0f3f8;
        border-radius: 4px;
        padding: 1px 4px;
        margin-left: 6px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        color: #64728a;
        font-size: 10.5px;
      }
      .person .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .person .avatar {
        width: 23px;
        height: 23px;
        font-size: 9px;
      }
      .executors {
        font-size: 10.5px;
        color: #728097;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .executors .second {
        display: inline-block;
        padding: 0 4px;
        font-size: 9px;
        color: #8c9ab3;
        border: 1px solid #e6ebf4;
        border-radius: 4px;
        margin-left: 3px;
      }
      .date {
        font-size: 11px;
        color: #6c7a91;
      }
      .date.overdue {
        color: var(--red);
      }
      .date small {
        font-size: 9px;
        display: block;
        margin-top: 2px;
      }
      .progress-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #7b899e;
        font-size: 10px;
      }
      .track {
        height: 4px;
        width: 49px;
        background: #eef1f7;
        border-radius: 4px;
        overflow: hidden;
      }
      .track > i {
        display: block;
        height: 100%;
        background: #7fa6ee;
        border-radius: 4px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 9px;
        white-space: nowrap;
        background: #f0f3f8;
        color: #7d8aa0;
      }
      .status i {
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
      }
      .status.IN_PROGRESS {
        background: #edf3ff;
        color: #4f7bd2;
      }
      .status.PAUSED {
        background: #fff5e7;
        color: #b49154;
      }
      .status.DONE {
        background: #e9f6ef;
        color: #4d9a79;
      }
      .rowmore {
        border: 0;
        background: none;
        color: #a0adbe;
        letter-spacing: 1px;
        padding: 8px 0;
        font-size: 15px;
      }
      .empty {
        text-align: center;
        padding: 58px 20px;
        color: #8a97ac;
      }
      .empty h3 {
        font-size: 16px;
        font-weight: 500;
        color: #64768e;
        margin: 12px 0 6px;
      }
      .empty p {
        font-size: 12px;
        margin: 0 0 18px;
      }
      .empty-icon {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        margin: auto;
        background: #eef3fc;
        color: #88a0c8;
        border-radius: 14px;
      }
      .bottom-line {
        color: #9ca7b8;
        font-size: 10px;
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 15px;
      }
      .bottom-line span:last-child {
        margin-left: auto;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: #192b4429;
        z-index: 20;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 480px;
        background: #fff;
        box-shadow: -12px 0 50px #1d35591a;
        z-index: 21;
        display: flex;
        flex-direction: column;
      }
      .drawer-head {
        padding: 24px 25px 18px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head .eyebrow {
        color: #8c9ab1;
        font-size: 10px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer h2 {
        font-size: 18px;
        line-height: 1.5;
        font-weight: 600;
        margin: 0;
      }
      .drawer-body {
        padding: 22px 25px;
        overflow: auto;
        flex: 1;
      }
      .drawer-footer {
        border-top: 1px solid var(--line);
        padding: 16px 25px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: white;
      }
      .drawer-footer .danger {
        margin-left: auto;
      }
      .field {
        margin-bottom: 17px;
      }
      .field > label,
      .field-label {
        font-size: 11px;
        font-weight: 600;
        color: #6c7c92;
        display: block;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        font-size: 12px;
      }
      .field textarea {
        resize: vertical;
        min-height: 90px;
        line-height: 1.6;
      }
      .field small {
        display: block;
        font-size: 10px;
        color: #98a4b7;
        margin-top: 5px;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form-error {
        padding: 10px;
        background: #fff0f0;
        color: #bd4d53;
        font-size: 12px;
        border-radius: 6px;
        margin-bottom: 14px;
      }
      .field .multi {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 9px;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
      }
      .multi label {
        display: flex;
        align-items: center;
        font-size: 10px;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 4px;
        background: #f5f7fc;
        color: #64768f;
        cursor: pointer;
      }
      .multi input {
        width: 12px;
        height: 12px;
        accent-color: var(--accent);
      }
      .mini-separator {
        border-top: 1px solid var(--line);
        padding-top: 16px;
        margin-top: 20px;
      }
      .comment {
        padding: 11px 12px;
        background: #f7f9fd;
        font-size: 11px;
        color: #78869c;
        border-radius: 7px;
        margin: 8px 0;
      }
      .comment strong {
        display: block;
        color: #61728b;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #192b4450;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .modal {
        width: 820px;
        max-width: 96vw;
        max-height: 90vh;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 22px 90px #1a2c4930;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal.small {
        width: 460px;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 25px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .modal-head p {
        margin: 5px 0 0;
        color: #8c99ad;
        font-size: 11px;
      }
      .modal-body {
        padding: 22px 25px;
        overflow: auto;
      }
      .modal-foot {
        padding: 16px 25px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        padding: 0 25px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 15px 0 12px;
        color: #8b98ac;

        items = items.filter((item) => !item.archived || ui.managerArchived);
        $("#directory-list").innerHTML =
          `<div class="dir-head"><span>Название</span><span>${mode === "projects" ? "Состояние" : "Роли"}</span><span>Задач</span><span style="text-align:right">Действия</span></div>${
            items
              .map((item) => {
                const count = model.tasks.filter((t) =>
                  mode === "projects"
                    ? t.project === item.id
                    : mode === "responsibles"
                      ? t.responsible === item.id
                      : t.executors.includes(item.id) ||
                        t.responsible === item.id,
                ).length;
                return `<div class="dir-row"><div style="display:flex;gap:9px;align-items:center" class="${item.archived ? "muted" : ""}">${mode === "projects" ? `<span class="dot" style="--dot:${item.color}"></span>` : `<span class="avatar">${E(initials(item.name))}</span>`}<span>${E(item.name)}</span></div><div class="roles">${mode === "projects" ? `<span class="badge">${item.archived ? "Скрыта" : "Активна"}</span>` : `<span class="badge">${E(item.type)}</span>${item.responsible ? '<span class="badge role">Ответственный</span>' : ""}${item.archived ? '<span class="badge">Скрыт</span>' : ""}`}</div><span class="muted" style="font-size:11px">${count}</span><div class="dir-actions"><button class="tinybtn" data-action="directory-edit" data-id="${E(item.id)}" title="Переименовать" aria-label="Переименовать ${E(item.name)}">${icon("edit", true)}</button><button class="tinybtn" data-action="directory-hide" data-id="${E(item.id)}" title="${item.archived ? "Вернуть в выбор" : "Скрыть из выбора"}" aria-label="${item.archived ? "Вернуть" : "Скрыть"} ${E(item.name)}">${icon("eye", true)}</button><button class="tinybtn" data-action="directory-delete" data-id="${E(item.id)}" title="${mode === "responsibles" ? "Убрать из ответственных" : "Удалить"}" aria-label="Удалить ${E(item.name)}">${icon("trash", true)}</button></div></div>`;
              })
              .join("") || '<div class="empty">Записей нет</div>'
          }`;
      }
      let directoryContext = null;
      function directoryEdit(id = null, forceProject = false) {
        const mode = forceProject ? "projects" : ui.manager,
          item = id ? (mode === "projects" ? proj(id) : person(id)) : null;
        directoryContext = { mode, id };
        if (mode === "responsibles" && !id) {
          const available = model.contacts.filter(
            (c) => !c.responsible && !c.archived && c.type === "Человек",
          );
          modal(
            "Добавить ответственного",
            `<div class="field"><label for="existing-contact">Выбрать человека из справочника</label><select id="existing-contact">${options(available, "", "Создать новую карточку")}</select></div><div class="field"><label for="directory-name">Имя нового человека</label><input id="directory-name" placeholder="Имя и фамилия"></div><div id="directory-error"></div>`,
            `<button class="btn" data-action="manage">Назад</button><button class="btn primary" data-action="directory-save">Добавить</button>`,
            true,
          );
        } else
          modal(
            item
              ? "Редактировать запись"
              : mode === "projects"
                ? "Новая тема"
                : "Новый контрагент",
            `<div class="field"><label for="directory-name">${mode === "projects" ? "Название темы" : "Название / имя"}</label><input id="directory-name" value="${E(item?.name || "")}" placeholder="Введите название" maxlength="100"></div>${mode !== "projects" ? `<div class="field"><label for="contact-type">Тип</label><select id="contact-type">${["Человек", "Организация", "Группа"].map((type) => `<option ${item?.type === type ? "selected" : ""}>${type}</option>`).join("")}</select></div><label style="display:flex;align-items:center;gap:8px;font-size:12px"><input type="checkbox" id="contact-responsible" ${item?.responsible ? "checked" : ""}>Доступен в списке ответственных</label>` : '<div class="info-box">Тема объединяет задачи и мероприятия. Людей назначают на конкретные задачи.</div>'}<div id="directory-error"></div>`,
            `<button class="btn" data-action="manage">Отмена</button><button class="btn primary" data-action="directory-save">Сохранить</button>`,
            true,
          );
        setTimeout(() => $("#directory-name")?.focus(), 30);
      }
      function saveDirectory() {
        const { mode, id } = directoryContext,
          name = $("#directory-name").value.replace(/\s+/g, " ").trim(),
          existing = $("#existing-contact")?.value;
        const collection =
          mode === "projects" ? model.projects : model.contacts;
        if (existing) {
          person(existing).responsible = true;
        } else {
          if (!name) {
            $("#directory-error").innerHTML =
              '<div class="form-error" style="margin-top:12px">Введите название</div>';
            return;
          }
          if (
            collection.some(
              (c) => c.id !== id && c.name.toLowerCase() === name.toLowerCase(),
            )
          ) {
            $("#directory-error").innerHTML =
              '<div class="form-error" style="margin-top:12px">Такая запись уже есть. Выберите существующую карточку.</div>';
            return;
          }
          if (id) {
            const item = collection.find((c) => c.id === id);
            if (mode !== "projects") {
              const responsible = $("#contact-responsible").checked;
              if (
                !responsible &&
                model.tasks.some((t) => t.responsible === id)
              ) {
                $("#directory-error").innerHTML =
                  '<div class="form-error" style="margin-top:12px">Этот человек назначен ответственным. Сначала снимите назначения или выберите замену через удаление из списка.</div>';
                return;
              }
              item.type = $("#contact-type").value;
              item.responsible = responsible;
            }
            item.name = name;
          } else if (mode === "projects") {
            collection.push({
              id: uid(),
              name,
              color: "#8fadd4",
              archived: false,
            });
          } else {
            collection.push({
              id: uid(),
              name,
              type:
                mode === "responsibles" ? "Человек" : $("#contact-type").value,
              responsible:
                mode === "responsibles" || $("#contact-responsible").checked,
              archived: false,
            });
          }
        }
        save();
        render();
        manage(mode);
        toast("Справочник обновлён");
      }
      let deleteContext = null;
      function directoryDelete(id) {
        const mode = ui.manager,
          item = mode === "projects" ? proj(id) : person(id),
          affected = model.tasks.filter((t) =>
            mode === "projects"
              ? t.project === id
              : mode === "responsibles"
                ? t.responsible === id
                : t.executors.includes(id) || t.responsible === id,
          );
        deleteContext = { mode, id };
        const choices =
          mode === "projects"
            ? model.projects.filter((p) => p.id !== id && !p.archived)
            : model.contacts.filter(
                (c) =>
                  c.id !== id &&
                  !c.archived &&
                  (!(
                    mode === "responsibles" ||
                    affected.some((t) => t.responsible === id)
                  ) ||
                    c.responsible),
              );
        modal(
          mode === "responsibles"
            ? "Убрать из ответственных?"
            : "Удалить запись?",
          `<p style="font-size:14px;margin-top:0">${E(item.name)}</p><div class="info-box">${affected.length ? `Связанных задач: <strong>${affected.length}</strong>. ` : ""}Сами задачи сохранятся.${mode === "responsibles" ? " Карточка останется среди контрагентов." : ""}</div>${affected.length ? `<div class="field"><label for="replacement">${mode === "projects" ? "Куда перенести задачи" : "Заменить назначение на"}</label><select id="replacement">${options(choices, "", mode === "projects" ? "Без темы" : "Снять назначение")}</select></div>` : ""}`,
          `<button class="btn" data-action="manage">Отмена</button><button class="btn danger" data-action="confirm-directory-delete">${mode === "responsibles" ? "Убрать из списка" : "Удалить запись"}</button>`,
          true,
        );
      }
      function confirmDirectoryDelete() {
        const { mode, id } = deleteContext,
          replacement = $("#replacement")?.value || "";
        for (const t of model.tasks) {
          if (mode === "projects" && t.project === id) t.project = replacement;
          if (mode === "contacts") {
            if (t.executors.includes(id))
              t.executors = [
                ...new Set(
                  t.executors
                    .map((value) => (value === id ? replacement : value))
                    .filter(Boolean),
                ),
              ];
            if (t.responsible === id)
              t.responsible = person(replacement)?.responsible
                ? replacement
                : "";
          }
          if (mode === "responsibles" && t.responsible === id)
            t.responsible = replacement;
        }
        if (mode === "projects") {
          model.projects = model.projects.filter((p) => p.id !== id);
          if (ui.project === id) ui.project = replacement || "all";
        } else if (mode === "contacts") {
          model.contacts = model.contacts.filter((c) => c.id !== id);
        } else person(id).responsible = false;
        if (ui.executor === id) ui.executor = "";
        if (ui.responsible === id) ui.responsible = "";
        save();
        render();
        manage(mode);
        toast("Запись убрана, задачи сохранены");
      }
      function popup(t, button) {
        const r = button.getBoundingClientRect();
        $("#popup-root").innerHTML =
          `<div class="popup" style="top:${Math.min(r.bottom + 3, innerHeight - 135)}px;left:${Math.min(r.left - 165, innerWidth - 210)}px"><button data-action="edit-task" data-id="${E(t.id)}">Открыть карточку</button><button data-action="add-child" data-id="${E(t.id)}">Добавить подзадачу</button><button class="danger" data-action="delete-task" data-id="${E(t.id)}">Удалить задачу</button></div>`;
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) {
          if (!event.target.closest(".popup")) $("#popup-root").innerHTML = "";
          return;
        }
        const a = button.dataset.action,
          id = button.dataset.id;
        $("#popup-root").innerHTML = "";
        switch (a) {
          case "project":
            ui.project = id;
            render();
            break;
          case "view":
            ui.view = id;
            render();
            break;
          case "clear-filter":
            ui[id] = "";
            render();
            break;
          case "reset-filters":
            ui.q = "";
            $("#search").value = "";
            ui.responsible = ui.executor = ui.status = ui.due = "";
            render();
            break;
          case "all-with-filters":
            ui.project = "all";
            render();
            break;
          case "toggle-task":
            ui.collapsed.has(id)
              ? ui.collapsed.delete(id)
              : ui.collapsed.add(id);
            renderContent();
            break;
          case "toggle-project":
            ui.closedProjects.has(id)
              ? ui.closedProjects.delete(id)
              : ui.closedProjects.add(id);
            renderContent();
            break;
          case "create-task":
            openTask();
            break;
          case "create-event":
            openTask(null, null, null, "event");
            break;
          case "add-to-project":
            openTask(null, null, id);
            break;
          case "edit-task":
            openTask(id);
            break;
          case "add-child":
            openTask(null, id);
            break;
          case "close-drawer":
            closeDrawer();
            break;
          case "delete-task":
            deleteTask(id);
            break;
          case "confirm-task-delete": {
            const t = task(id);
            for (const f of t.attachments)
              if (!f.demo) void fileStore("delete", f.id).catch(() => {});
            for (const child of model.tasks.filter((c) => c.parent === id))
              child.parent = t.parent;
            model.tasks = model.tasks.filter((t) => t.id !== id);
            save();
            closeModal();
            closeDrawer();
            render();
            toast("Задача удалена, подзадачи сохранены");
            break;
          }
          case "task-menu":
            popup(task(id), button);
            break;
          case "manage":
            manage();
            break;
          case "manage-tab":
            manage(id);
            break;
          case "new-project":
            directoryEdit(null, true);
            break;
          case "directory-add":
            directoryEdit();
            break;
          case "directory-edit":
            directoryEdit(id);
            break;
          case "directory-save":
            saveDirectory();
            break;
          case "directory-hide": {
            const item = ui.manager === "projects" ? proj(id) : person(id);
            item.archived = !item.archived;
            save();
            render();
            manage();
            toast(
              item.archived
                ? "Скрыто из выбора. Связи сохранены."
                : "Снова доступно для выбора",
            );
            break;
          }
          case "directory-delete":
            directoryDelete(id);
            break;
          case "confirm-directory-delete":
            confirmDirectoryDelete();
            break;
          case "close-modal":
            closeModal();
            break;
          case "quick-note":
            ui.quick = ui.quick === id ? null : id;
            renderContent();
            document
              .querySelector(
                `.note-composer[data-scope="row"][data-task="${CSS.escape(id)}"] .note-text`,
              )
              ?.focus();
            break;
          case "post-note":
            postNote(button.closest(".note-composer"));
            break;
          case "add-comment":
            postNote($("#comment-text")?.closest(".note-composer"));
            break;
          case "resolve-note": {
            const t = record(id),
              note = t?.comments.find((c) => c.id === button.dataset.note);
            if (!note) break;
            note.resolved = !note.resolved;
            if (task(id)) save();
            refreshActivity(id);
            toast(
              note.resolved ? "Вопрос отмечен решённым" : "Вопрос снова открыт",
            );
            break;
          }
          case "office-sheet":
            if (officeView) {
              officeView.sheet = Number(id);
              officeView.row = officeView.col = 0;
              renderWorkbook();
            }
            break;
          case "office-row":
            if (officeView) {
              officeView.row = Math.max(0, officeView.row + Number(id));
              renderWorkbook();
            }
            break;
          case "office-col":
            if (officeView) {
              officeView.col = Math.max(0, officeView.col + Number(id));
              renderWorkbook();
            }
            break;
          case "preview-file":
            void previewFile(id, button.dataset.file);
            break;
          case "download-file":
            void previewFile(id, button.dataset.file, true);
            break;
          case "remove-file": {
            const t = record(id),
              file = t?.attachments.find((f) => f.id === button.dataset.file);
            if (!file) break;
            t.attachments = t.attachments.filter((f) => f.id !== file.id);
            if (task(id)) save();
            if (!file.demo) void fileStore("delete", file.id).catch(() => {});
            refreshActivity(id);
            toast("Файл убран из задачи");
            break;
          }
          case "deadline-period":
            ui.deadlinePeriod = id;
            renderContent();
            break;
          case "reset-demo":
            modal(
              "Сбросить пример?",
              '<p style="font-size:12px;color:#7d8ca3">Изменения в этом макете будут заменены исходными демонстрационными данными.</p>',
              '<button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-reset">Сбросить пример</button>',
              true,
            );
            break;
          case "confirm-reset":
            closeDrawer();
            for (const t of model.tasks)
              for (const f of t.attachments || [])
                if (!f.demo) void fileStore("delete", f.id).catch(() => {});
            model = structuredClone(seed);
            for (const t of model.tasks)
              t.comments.forEach((c, index) => {
                c.id ||= `${t.id}-note-${index}`;
                c.kind ||= "comment";
              });
            ui.quick = null;
            ui.noteDrafts = {};
            ui.deadlinePeriod = "7";
            ui.deadlineStart = TODAY;
            ui.deadlineEnd = "2026-11-06";
            ui.deadlineOverdue = true;
            ui.project = "all";
            ui.responsible = ui.executor = ui.status = ui.due = ui.q = "";
            ui.done = false;
            ui.expand = true;
            ui.view = "table";
            ui.manager = "projects";
            ui.managerArchived = false;
            ui.collapsed.clear();
            ui.closedProjects.clear();
            $("#search").value = "";
            save();
            closeModal();
            closeDrawer();
            render();
            $("#project-list").scrollTop = 0;
            $("#main-scroll").scrollTop = 0;
            toast("Пример восстановлен");
            break;
        }
      });
      document.addEventListener("input", (event) => {
        const composer = event.target.closest(".note-composer");
        if (composer)
          ui.noteDrafts[`${composer.dataset.scope}:${composer.dataset.task}`] =
            {
              kind: composer.querySelector(".note-kind").value,
              text: composer.querySelector(".note-text").value,
            };
      });
      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-upload-task]")) {
          void uploadFiles(event.target);
          return;
        }
        const composer = event.target.closest(".note-composer");
        if (composer)
          ui.noteDrafts[`${composer.dataset.scope}:${composer.dataset.task}`] =
            {
              kind: composer.querySelector(".note-kind").value,
              text: composer.querySelector(".note-text").value,
            };
        if (event.target.id === "task-kind") updateEventFields();
        if (event.target.id === "deadline-overdue") {
          ui.deadlineOverdue = event.target.checked;
          renderContent();
        }
        if (event.target.id === "deadline-start") {
          ui.deadlineStart = event.target.value;
          renderContent();
        }
        if (event.target.id === "deadline-end") {
          ui.deadlineEnd = event.target.value;
          renderContent();
        }
        const id = event.target.id,
          value = event.target.value;
        const map = {
          "responsible-filter": "responsible",
          "executor-filter": "executor",
          "status-filter": "status",
          "due-filter": "due",
        };
        if (map[id]) {
          ui[map[id]] = value;
          render();
        }
        if (id === "show-done") {
          ui.done = event.target.checked;
          render();
        }
        if (id === "expand-all") {
          ui.expand = event.target.checked;
          ui.collapsed.clear();
          render();
        }
        if (id === "manager-archived") {
          ui.managerArchived = event.target.checked;
          renderDirectory();
        }
        if (id === "task-parent") {
          const parent = task(value);
          $("#task-project").disabled = !!parent;
          if (parent) $("#task-project").value = parent.project;
        }
        if (id === "task-project") {
          const selected = ui.drawer.id ? descendants(ui.drawer.id) : new Set();
          $("#task-parent").innerHTML =
            '<option value="">Самостоятельная задача</option>' +
            model.tasks
              .filter((t) => t.project === value && !selected.has(t.id))
              .map((t) => `<option value="${E(t.id)}">${E(t.title)}</option>`)
              .join("");
        }
        if (id === "existing-contact") {
          $("#directory-name").disabled = !!value;
        }
      });
      $("#search").addEventListener("input", (event) => {
        ui.q = event.target.value;
        renderContent();
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "task-form") {
          event.preventDefault();
          saveTask(event.target);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing &&
          event.target.matches(".note-text")
        ) {
          event.preventDefault();
          postNote(event.target.closest(".note-composer"));
          return;
        }
        if (event.key === "Escape") {
          if ($("#modal-root").children.length) closeModal();
          else closeDrawer();
          $("#popup-root").innerHTML = "";
        }
        if (
          event.key === "/" &&
          !["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement.tagName,
          )
        ) {
          event.preventDefault();
          $("#search").focus();
        }
        if (event.key === "Tab") {
          const container =
            $("#modal-root .modal") || $("#drawer-root .drawer");
          if (container) {
            const inputs = [
              ...container.querySelectorAll("button,input,select,textarea"),
            ].filter((e) => !e.disabled && e.offsetParent !== null);
            const first = inputs[0],
              last = inputs.at(-1);
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last?.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first?.focus();
            }
          }
        }
      });
      render();
    </script>
  </body>
</html>
