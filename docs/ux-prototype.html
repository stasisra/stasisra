<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Темы и задачи — интерактивный макет</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --paper: #fff;
        --text: #202b3b;
        --muted: #7a8799;
        --line: #e7ebf2;
        --accent: #3569dc;
        --soft: #edf3ff;
        --green: #15936f;
        --red: #d45459;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 "Segoe UI",
          Arial,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #90b1ff;
        outline-offset: 2px;
      }
      button {
        color: inherit;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      input,
      select,
      textarea {
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 9px 11px;
        background: #fff;
        color: var(--text);
        min-width: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #b6cdff;
        border-color: var(--accent);
      }
      button svg {
        pointer-events: none;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .small-icon {
        width: 15px;
        height: 15px;
      }
      .topbar {
        height: 62px;
        display: flex;
        align-items: center;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 26px;
        gap: 38px;
      }
      .brand {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border-radius: 8px;
        color: white;
        background: var(--accent);
      }
      .topnav {
        display: flex;
        gap: 25px;
        height: 100%;
        align-items: center;
      }
      .topnav button {
        height: 100%;
        border: 0;
        background: none;
        color: var(--muted);
        position: relative;
        padding: 0 2px;
      }
      .topnav button.active {
        color: var(--accent);
        font-weight: 600;
      }
      .topnav button.active:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--accent);
        border-radius: 3px;
      }
      .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 700;
        background: #e9efff;
        color: #4a66a1;
      }
      .avatar.a1 {
        background: #f0eafe;
        color: #8d68ae;
      }
      .avatar.a2 {
        background: #e2f3ec;
        color: #3f8a70;
      }
      .avatar.a3 {
        background: #fff0e1;
        color: #a37b48;
      }
      .avatar.a4 {
        background: #e5f1f7;
        color: #477e9c;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .demo-bar {
        height: 34px;
        background: #f0f4fb;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c7c94;
        font-size: 11px;
        gap: 12px;
      }
      .demo-bar button {
        border: 0;
        background: none;
        color: #5879b0;
        text-decoration: underline;
        font-size: 11px;
      }
      .layout {
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        height: calc(100vh - 96px);
      }
      aside.sidebar {
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 24px 14px 14px;
        overflow: hidden;
      }
      .side-label {
        padding: 0 12px;
        margin-bottom: 10px;
        color: #8b97a8;
        font-size: 10px;
        letter-spacing: 1.4px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .side-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 24px 12px 9px;
        font-size: 10px;
        letter-spacing: 1.2px;
        color: #8b97a8;
        font-weight: 700;
      }
      .side-scroll {
        overflow: auto;
        flex: 1;
        margin-top: 2px;
      }
      .side-item {
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 10px;
        padding: 10px 12px;
        margin: 2px 0;
        border-radius: 8px;
        font-size: 12px;
        min-height: 39px;
      }
      .side-item:hover {
        background: #f6f8fc;
      }
      .side-item.selected {
        background: var(--soft);
        color: var(--accent);
        font-weight: 600;
      }
      .side-item .num {
        margin-left: auto;
        font-size: 11px;
        color: #99a3b4;
      }
      .side-item.selected .num {
        background: #dce8ff;
        color: var(--accent);
        padding: 1px 6px;
        border-radius: 5px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
        flex-shrink: 0;
        background: var(--dot, #a1b2cb);
      }
      .side-item .label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .side-foot {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .side-foot .hint {
        margin: 14px 12px 0;
        font-size: 10px;
        color: #a0aaba;
      }
      .tinybtn {
        border: 0;
        background: none;
        border-radius: 5px;
        padding: 2px 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #8592a7;
      }
      .tinybtn:hover {
        background: #edf2fb;
        color: var(--accent);
      }
      main {
        overflow: auto;
        padding: 29px 30px 50px;
      }
      .breadcrumb {
        font-size: 11px;
        color: #93a0b2;
        margin-bottom: 9px;
      }
      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .page-head h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.7px;
        font-weight: 650;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin: 7px 0 0;
      }
      .head-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-top: 3px;
      }
      .btn {
        padding: 9px 13px;
        border: 1px solid #dfe5ee;
        background: #fff;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
        font-size: 12px;
        white-space: nowrap;
      }
      .btn:hover {
        background: #f6f8fc;
      }
      .btn.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 2px 3px #295cc91a;
      }
      .btn.primary:hover {
        background: #285bcb;
      }
      .btn.danger {
        color: #c44f54;
        border-color: #f1d6d7;
      }
      .btn.danger:hover {
        background: #fff5f5;
      }
      .btn.soft {
        border: 0;
        background: #edf3ff;
        color: var(--accent);
      }
      .search {
        margin-top: 25px;
        display: flex;
        align-items: center;
        position: relative;
      }
      .search .icon {
        position: absolute;
        left: 13px;
        color: #8d9bb0;
      }
      .search input {
        width: 100%;
        padding: 11px 14px 11px 40px;
        font-size: 12px;
        background: #fff;
        box-shadow: 0 1px 3px #17284103;
      }
      .search .key {
        position: absolute;
        right: 11px;
        font-size: 10px;
        color: #a1abba;
        border: 1px solid #e6eaf2;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .filterbar {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
        margin: 14px 0 12px;
      }
      .filterbar select {
        font-size: 11px;
        padding: 7px 28px 7px 10px;
        max-width: 220px;
        color: #536177;
      }
      .filterbar .label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #6f7e93;
        margin-left: 4px;
      }
      .filterbar input[type="checkbox"] {
        width: 13px;
        height: 13px;
        accent-color: var(--accent);
      }
      .filterbar .spacer {
        margin-left: auto;
      }
      .view-switch {
        display: flex;
        border: 1px solid #dfe5ed;
        padding: 2px;
        border-radius: 7px;
        background: #fff;
      }
      .view-switch button {
        padding: 5px 8px;
        border: 0;
        background: none;
        color: #8a96a8;
        border-radius: 4px;
        font-size: 11px;
      }
      .view-switch button.active {
        background: #edf2fb;
        color: #4e6da3;
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        font-size: 11px;
        min-height: 4px;
        margin-bottom: 12px;
      }
      .chip {
        background: #eaf1ff;
        border: 1px solid #dce8ff;
        padding: 4px 8px;
        border-radius: 5px;
        color: #4169ad;
      }
      .chip button {
        border: 0;
        background: none;
        color: #6b88bc;
        margin-left: 7px;
        padding: 0;
      }
      .textbtn {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 3px 1px;
        font-size: 11px;
      }
      .section {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        margin-bottom: 16px;
        box-shadow: 0 2px 4px #24375702;
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: #fcfdff;
      }
      .section-head h2 {
        font-size: 13px;
        margin: 0;
        font-weight: 650;
      }
      .section-head .count {
        font-size: 10px;
        color: #8794a8;
        padding: 1px 6px;
        border: 1px solid #e6ebf4;
        border-radius: 5px;
        background: #fff;
      }
      .section-head .section-hint {
        font-size: 10px;
        color: #9aa5b5;
      }
      .section-head .add {
        margin-left: auto;
      }
      .collapse {
        border: 0;
        background: none;
        color: #8493aa;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }
      .collapse .icon {
        width: 13px;
        height: 13px;
        transition: transform 0.15s;
      }
      .collapse.shut .icon {
        transform: rotate(-90deg);
      }
      .table-head,
      .task-row {
        display: grid;
        grid-template-columns:
          minmax(235px, 1fr)
          144px 142px 109px 94px 112px 30px;
        align-items: center;
        column-gap: 10px;
        padding: 0 15px;
      }
      .table-head {
        font-size: 10px;
        color: #96a1b2;
        height: 33px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .task-row {
        min-height: 55px;
        border-bottom: 1px solid #f0f2f7;
        font-size: 11px;
      }
      .task-row:last-child {
        border: 0;
      }
      .task-row:hover {
        background: #f9fbff;
      }
      .task-row.context {
        background: #fcfdff;
      }
      .task-cell {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        min-width: 0;
        padding: 10px 0;
      }
      .task-cell .task-icon {
        color: #a7b3c6;
        padding-top: 2px;
        flex-shrink: 0;
      }
      .task-cell .task-icon.event {
        color: #a58cc9;
      }
      .task-cell .arrow-holder {
        width: 16px;
        min-width: 16px;
        padding-top: 3px;
      }
      .task-label {
        min-width: 0;
      }
      .task-title {
        font-weight: 500;
        font-size: 12px;
        line-height: 1.4;
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        color: #34435b;
        max-width: 100%;
      }
      .task-title:hover {
        color: var(--accent);
      }
      .task-row.parent .task-title {
        font-weight: 650;
      }
      .task-row.context .task-title {
        color: #8c9ab0;
      }
      .task-desc {
        display: block;
        color: #99a4b6;
        font-size: 10px;
        margin-top: 3px;
        max-width: 290px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .child-count {
        font-size: 9px;
        color: #8b9bb6;
        background: #f0f3f8;
        border-radius: 4px;
        padding: 1px 4px;
        margin-left: 6px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        color: #64728a;
        font-size: 10.5px;
      }
      .person .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .person .avatar {
        width: 23px;
        height: 23px;
        font-size: 9px;
      }
      .executors {
        font-size: 10.5px;
        color: #728097;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .executors .second {
        display: inline-block;
        padding: 0 4px;
        font-size: 9px;
        color: #8c9ab3;
        border: 1px solid #e6ebf4;
        border-radius: 4px;
        margin-left: 3px;
      }
      .date {
        font-size: 11px;
        color: #6c7a91;
      }
      .date.overdue {
        color: var(--red);
      }
      .date small {
        font-size: 9px;
        display: block;
        margin-top: 2px;
      }
      .progress-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #7b899e;
        font-size: 10px;
      }
      .track {
        height: 4px;
        width: 49px;
        background: #eef1f7;
        border-radius: 4px;
        overflow: hidden;
      }
      .track > i {
        display: block;
        height: 100%;
        background: #7fa6ee;
        border-radius: 4px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 9px;
        white-space: nowrap;
        background: #f0f3f8;
        color: #7d8aa0;
      }
      .status i {
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
      }
      .status.IN_PROGRESS {
        background: #edf3ff;
        color: #4f7bd2;
      }
      .status.PAUSED {
        background: #fff5e7;
        color: #b49154;
      }
      .status.DONE {
        background: #e9f6ef;
        color: #4d9a79;
      }
      .rowmore {
        border: 0;
        background: none;
        color: #a0adbe;
        letter-spacing: 1px;
        padding: 8px 0;
        font-size: 15px;
      }
      .empty {
        text-align: center;
        padding: 58px 20px;
        color: #8a97ac;
      }
      .empty h3 {
        font-size: 16px;
        font-weight: 500;
        color: #64768e;
        margin: 12px 0 6px;
      }
      .empty p {
        font-size: 12px;
        margin: 0 0 18px;
      }
      .empty-icon {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        margin: auto;
        background: #eef3fc;
        color: #88a0c8;
        border-radius: 14px;
      }
      .bottom-line {
        color: #9ca7b8;
        font-size: 10px;
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 15px;
      }
      .bottom-line span:last-child {
        margin-left: auto;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: #192b4429;
        z-index: 20;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 480px;
        background: #fff;
        box-shadow: -12px 0 50px #1d35591a;
        z-index: 21;
        display: flex;
        flex-direction: column;
      }
      .drawer-head {
        padding: 24px 25px 18px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head .eyebrow {
        color: #8c9ab1;
        font-size: 10px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer h2 {
        font-size: 18px;
        line-height: 1.5;
        font-weight: 600;
        margin: 0;
      }
      .drawer-body {
        padding: 22px 25px;
        overflow: auto;
        flex: 1;
      }
      .drawer-footer {
        border-top: 1px solid var(--line);
        padding: 16px 25px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: white;
      }
      .drawer-footer .danger {
        margin-left: auto;
      }
      .field {
        margin-bottom: 17px;
      }
      .field > label,
      .field-label {
        font-size: 11px;
        font-weight: 600;
        color: #6c7c92;
        display: block;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        font-size: 12px;
      }
      .field textarea {
        resize: vertical;
        min-height: 90px;
        line-height: 1.6;
      }
      .field small {
        display: block;
        font-size: 10px;
        color: #98a4b7;
        margin-top: 5px;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form-error {
        padding: 10px;
        background: #fff0f0;
        color: #bd4d53;
        font-size: 12px;
        border-radius: 6px;
        margin-bottom: 14px;
      }
      .field .multi {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 9px;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
      }
      .multi label {
        display: flex;
        align-items: center;
        font-size: 10px;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 4px;
        background: #f5f7fc;
        color: #64768f;
        cursor: pointer;
      }
      .multi input {
        width: 12px;
        height: 12px;
        accent-color: var(--accent);
      }
      .mini-separator {
        border-top: 1px solid var(--line);
        padding-top: 16px;
        margin-top: 20px;
      }
      .comment {
        padding: 11px 12px;
        background: #f7f9fd;
        font-size: 11px;
        color: #78869c;
        border-radius: 7px;
        margin: 8px 0;
      }
      .comment strong {
        display: block;
        color: #61728b;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #192b4450;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .modal {
        width: 820px;
        max-width: 96vw;
        max-height: 90vh;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 22px 90px #1a2c4930;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal.small {
        width: 460px;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 25px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .modal-head p {
        margin: 5px 0 0;
        color: #8c99ad;
        font-size: 11px;
      }
      .modal-body {
        padding: 22px 25px;
        overflow: auto;
      }
      .modal-foot {
        padding: 16px 25px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        padding: 0 25px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 15px 0 12px;
        color: #8b98ac;

      function renderWorkbook() {

          let cells = `<th>${row + 1}</th>`;

            const cell = sheet[XLSX.utils.encode_cell({ r: row, c: col })];

      function exportOutput(type) {

          ...(meeting.comments !== "none" ? [["comment", "Комментарии"]] : []),
          ...(meeting.files ? [["files", "Вложения"]] : []),
        ];
        const headers = [
          ...meeting.columns.map((key) => OUTPUT_COLUMNS[key]),
          ...extras.map((pair) => pair[1]),

          .filter((id) => meeting.selected.has(id))

            const t = task(id),

      function meetingControl(event) {

            ? comments.slice(-1)
            : [])
          parts.push({ type: "comment", label: "Комментарий", text: c.text });
        if (meeting.files && t.attachments.length)
          parts.push({
            type: "files",
            label: "Материалы",
            text: t.attachments.map((f) => f.name).join(" · "),
          });
        return parts;
      }
      function writeLines(lines, label = "Решение / ответственный / срок") {
        return lines
          ? `<div class="sheet-writing"><div class="sheet-write-title">${E(label)}</div>${'<div class="sheet-write-line"></div>'.repeat(lines)}</div>`
          : "";
      }
      function meetingCardEntry(
        block,
        parts = block.parts,
        notes = block.notes,
        continued = false,
      ) {
        const node = document.createElement("article");
        node.className =
          "meeting-entry" + (block.context ? " sheet-context" : "");
        node.dataset.sheetTask = block.id;
        const title = continued
          ? block.title.slice(0, 120) + " · продолжение"
          : block.title;
        node.innerHTML = `${block.path ? `<div class="sheet-path">${E(block.path)}</div>` : ""}<h2>${block.number ? `<span class="sheet-check"></span><span class="sheet-item-number">${E(block.number)}.</span>` : ""}<span>${E(title)}</span></h2>${block.metadata ? `<div class="sheet-item-meta">${E(block.metadata)}</div>` : ""}<div class="sheet-entry-grid ${meeting.noteLayout === "right" && !block.summary ? "notes-right" : ""}"><div class="sheet-materials">${parts.map((p) => `<div class="sheet-part ${p.type}">${p.label ? `<strong>${E(p.label)}</strong>` : ""}${E(p.text)}</div>`).join("")}</div>${notes ? writeLines(block.summary ? 3 : meeting.lines, block.summary ? "Решения, договорённости и следующие шаги" : "Решение / ответственный / срок") : ""}</div>`;
        return node;
      }
      function shortMeetingParts(parts) {
        const out = [];
        for (const part of parts) {
          if (part.text.length <= 420) {
            out.push(part);
            continue;
          }
          const tokens = part.text.match(/\S+\s*|\s+/g) || [part.text];
          let chunk = "",
            continuation = false;
          for (const token of tokens) {
            const chars = Array.from(token);
            for (let offset = 0; offset < chars.length; offset += 420) {
              const piece = chars.slice(offset, offset + 420).join("");
              if (chunk.length + piece.length > 420 && chunk) {
                out.push({
                  ...part,
                  label:
                    continuation && part.label
                      ? part.label + " · продолжение"
                      : part.label,
                  text: chunk,
                });
                continuation = true;
                chunk = "";
              }
              chunk += piece;
            }
          }
          if (chunk)
            out.push({
              ...part,
              label:
                continuation && part.label
                  ? part.label + " · продолжение"
                  : part.label,
              text: chunk,
            });
        }
        return out;
      }
      function paginateOutput() {
        if (!meeting || !$("#meeting-pages")) return;
        clearTimeout(meetingTimer);
        const pages = $("#meeting-pages");
        pages.style.zoom = "1";
        pages.innerHTML = "";
        let page = meetingPage(),
          body = page.querySelector(".sheet-body"),
          error = "";
        const fits = () =>
          body.clientHeight > 60 && body.scrollHeight <= body.clientHeight + 1;
        const next = () => {
          page = meetingPage();
          body = page.querySelector(".sheet-body");
        };
        const append = (node) => {
          body.append(node);
          return fits();
        };
        for (const block of meetingBlocks()) {
          if (block.breakBefore && body.children.length) next();
          let node = meetingEntry(block);
          if (append(node)) continue;
          node.remove();
          if (body.children.length) next();
          node = meetingEntry(block);
          if (append(node)) continue;
          node.remove();
          // Long items continue with their title repeated; ordinary items stay together.
          const parts = shortMeetingParts(block.parts);
          let current = [],
            continued = false;
          for (const part of parts) {
            node = meetingEntry(block, [...current, part], false, continued);
            if (append(node)) {
              node.remove();
              current.push(part);
              continue;
            }
            node.remove();
            if (current.length) {
              body.append(meetingEntry(block, current, false, continued));
              next();
              continued = true;
              current = [];
            }
            node = meetingEntry(block, [part], false, continued);
            if (!append(node)) {
              node.remove();
              error =
                "Заголовок занимает слишком много места. Сократите заголовок листа или выберите меньший размер текста.";
              break;
            }
            node.remove();
            current.push(part);
          }
          if (error) break;
          node = meetingEntry(block, current, block.notes, continued);
          if (!append(node)) {
            node.remove();
            if (current.length)
              body.append(meetingEntry(block, current, false, continued));
            if (body.children.length) next();
            node = meetingEntry(block, [], block.notes, true);
            if (!append(node)) {
              node.remove();
              error =
                "Уменьшите число строк для заметок или выберите книжную ориентацию.";
              break;
            }
          }
        }
        const all = [...pages.querySelectorAll(".paper-page")];
        for (let i = 0; i < all.length; i++)
          all[i].querySelector(".sheet-page-number").textContent =
            `${i + 1} / ${all.length}`;
        meeting.pages = all.length;
        meeting.valid = !error;
        $("#meeting-count").textContent =
          `Страниц: ${all.length} · Выбрано пунктов: ${meeting.selected.size}`;
        $('#meeting-root [data-action="meeting-print"]').disabled = !!error;
        if (error)
          pages.insertAdjacentHTML(
            "afterbegin",
            `<p class="meeting-preview-error" role="alert">${E(error)}</p>`,
          );
        fitMeetingPreview();
      }
      function fitMeetingPreview() {
        const paper = $("#meeting-pages .paper-page"),
          pane = $("#meeting-preview");
        if (!paper || !pane) return;
        const width = Math.max(
          0.2,
          (pane.clientWidth - 48) / paper.offsetWidth,
        );
        const height = Math.max(
          0.2,
          (pane.clientHeight - 48) / paper.offsetHeight,
        );
        $("#meeting-pages").style.zoom = String(
          meeting.previewZoom === "100"
            ? 1
            : meeting.previewZoom === "width"
              ? Math.min(1, width)
              : Math.min(1, width, height),
        );
      }
      function printMeeting() {
        if (queryPending("output")) {
          toast("Примените фильтры перед выводом");
          return;
        }
        renderMeetingPreview();
        if (!meeting?.valid) return;
        $("#print-output").innerHTML = $("#meeting-pages").innerHTML;
        let style = $("#meeting-page-style");
        if (!style) {
          style = document.createElement("style");
          style.id = "meeting-page-style";
          document.head.append(style);
        }
        style.textContent = `@page {size:A4 ${meeting.orientation};margin:0;}`;
        document.body.classList.add("meeting-print");
        window.print();
      }
      function popup(t, button) {
        const r = button.getBoundingClientRect();
        $("#popup-root").innerHTML =
          `<div class="popup" style="top:${Math.min(r.bottom + 3, innerHeight - 180)}px;left:${Math.min(r.left - 165, innerWidth - 210)}px"><button data-action="edit-task" data-id="${E(t.id)}">Открыть карточку</button><button data-action="add-child" data-id="${E(t.id)}">Добавить подзадачу</button><button data-action="meeting-open" data-id="${E(t.id)}">Печать / экспорт</button><button class="danger" data-action="delete-task" data-id="${E(t.id)}">Удалить задачу</button></div>`;
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) {
          if (!event.target.closest(".popup")) $("#popup-root").innerHTML = "";
          return;
        }
        const a = button.dataset.action,
          id = button.dataset.id;
        $("#popup-root").innerHTML = "";
        switch (a) {
          case "query-apply":
            applyQuery(button.dataset.scope);
            break;
          case "query-reset":
            resetQuery(button.dataset.scope);
            break;
          case "query-period":
            quickPeriod(button.dataset.scope, id);
            break;
          case "query-all-themes": {
            const q = queryDraft(button.dataset.scope);
            q.projects = [];
            button
              .closest("[data-query-scope]")
              .querySelectorAll("[data-query-theme]")
              .forEach((box) => (box.checked = false));
            button
              .closest("[data-query-scope]")
              .querySelector(".theme-summary-label").textContent = "Все темы";
            $("#query-feedback-" + button.dataset.scope).textContent =
              "Выбраны все темы — нажмите «Применить»";
            markQueryButtons(button.dataset.scope);
            break;
          }
          case "query-themes-done":
            button.closest(".query-theme-picker").open = false;
            break;
          case "output-format":
            changeOutputFormat(id);
            break;
          case "output-source":
            outputSource(id);
            break;
          case "output-csv":
            exportOutput("csv");
            break;
          case "output-xlsx":
            exportOutput("xlsx");
            break;
          case "meeting-open":
            openMeeting(id);
            break;
          case "meeting-close":
            closeMeeting();
            break;
          case "meeting-preset":
            applyMeetingPreset(id);
            break;
          case "meeting-print":
            printMeeting();
            break;
          case "meeting-remember":
            rememberMeeting();
            break;
          case "meeting-select-all":
            meeting.excluded.clear();
            meeting.selected = new Set(meeting.order);
            renderMeetingTree();
            renderMeetingPreview();
            break;
          case "meeting-select-none":
            meeting.selected.clear();
            meeting.excluded = new Set(meeting.order);
            renderMeetingTree();
            renderMeetingPreview();
            break;
          case "meeting-up":
            moveMeetingItem(id, -1);
            break;
          case "meeting-down":
            moveMeetingItem(id, 1);
            break;
          case "meeting-break":
            meeting.breaks.has(id)
              ? meeting.breaks.delete(id)
              : meeting.breaks.add(id);
            renderMeetingTree();
            renderMeetingPreview();
            break;
          case "project":
            ui.projects = id === "all" ? [] : [id];
            ui.filterDraft = null;
            ui.project = id;
            render();
            break;
          case "view":
            if (id === "deadlines") {
              ui.dateMode = "deadline";
              if (!ui.from && !ui.to) {
                ui.from = TODAY;
                ui.to = addDays(TODAY, 6);
              }
              ui.filterDraft = null;
            }
            ui.view = id;
            render();
            break;
          case "clear-filter":
            ui[id] = "";
            render();
            break;
          case "reset-filters":
            ui.projects = [];
            ui.project = "all";
            ui.from = ui.to = "";
            ui.dateMode = ui.view === "deadlines" ? "deadline" : "overlap";
            ui.filterDraft = null;
            ui.q = "";
            $("#search").value = "";
            ui.responsible = ui.executor = ui.status = ui.due = "";
            render();
            break;
          case "all-with-filters":
            ui.projects = [];
            ui.filterDraft = null;
            ui.project = "all";
            render();
            break;
          case "toggle-task":
            ui.collapsed.has(id)
              ? ui.collapsed.delete(id)
              : ui.collapsed.add(id);
            renderContent();
            break;
          case "toggle-project":
            ui.closedProjects.has(id)
              ? ui.closedProjects.delete(id)
              : ui.closedProjects.add(id);
            renderContent();
            break;
          case "create-task":
            openTask();
            break;
          case "create-event":
            openTask(null, null, null, "event");
            break;
          case "add-to-project":
            openTask(null, null, id);
            break;
          case "edit-task":
            openTask(id);
            break;
          case "add-child":
            openTask(null, id);
            break;
          case "close-drawer":
            closeDrawer();
            break;
          case "delete-task":
            deleteTask(id);
            break;
          case "confirm-task-delete": {
            const t = task(id);
            for (const f of t.attachments)
              if (!f.demo) void fileStore("delete", f.id).catch(() => {});
            for (const child of model.tasks.filter((c) => c.parent === id))
              child.parent = t.parent;
            model.tasks = model.tasks.filter((t) => t.id !== id);
            save();
            closeModal();
            closeDrawer();
            render();
            toast("Задача удалена, подзадачи сохранены");
            break;
          }
          case "task-menu":
            popup(task(id), button);
            break;
          case "manage":
            manage();
            break;
          case "manage-tab":
            manage(id);
            break;
          case "new-project":
            directoryEdit(null, true);
            break;
          case "directory-add":
            directoryEdit();
            break;
          case "directory-edit":
            directoryEdit(id);
            break;
          case "directory-save":
            saveDirectory();
            break;
          case "directory-hide": {
            const item = ui.manager === "projects" ? proj(id) : person(id);
            item.archived = !item.archived;
            save();
            render();
            manage();
            toast(
              item.archived
                ? "Скрыто из выбора. Связи сохранены."
                : "Снова доступно для выбора",
            );
            break;
          }
          case "directory-delete":
            directoryDelete(id);
            break;
          case "confirm-directory-delete":
            confirmDirectoryDelete();
            break;
          case "close-modal":
            closeModal();
            break;
          case "quick-note":
            ui.quick = ui.quick === id ? null : id;
            renderContent();
            document
              .querySelector(
                `.note-composer[data-scope="row"][data-task="${CSS.escape(id)}"] .note-text`,
              )
              ?.focus();
            break;
          case "post-note":
            postNote(button.closest(".note-composer"));
            break;
          case "add-comment":
            postNote($("#comment-text")?.closest(".note-composer"));
            break;
          case "resolve-note": {
            const t = record(id),
              note = t?.comments.find((c) => c.id === button.dataset.note);
            if (!note) break;
            note.resolved = !note.resolved;
            if (task(id)) save();
            refreshActivity(id);
            toast(
              note.resolved ? "Вопрос отмечен решённым" : "Вопрос снова открыт",
            );
            break;
          }
          case "office-sheet":
            if (officeView) {
              officeView.sheet = Number(id);
              officeView.row = officeView.col = 0;
              renderWorkbook();
            }
            break;
          case "office-row":
            if (officeView) {
              officeView.row = Math.max(0, officeView.row + Number(id));
              renderWorkbook();
            }
            break;
          case "office-col":
            if (officeView) {
              officeView.col = Math.max(0, officeView.col + Number(id));
              renderWorkbook();
            }
            break;
          case "preview-file":
            void previewFile(id, button.dataset.file);
            break;
          case "download-file":
            void previewFile(id, button.dataset.file, true);
            break;
          case "remove-file": {
            const t = record(id),
              file = t?.attachments.find((f) => f.id === button.dataset.file);
            if (!file) break;
            t.attachments = t.attachments.filter((f) => f.id !== file.id);
            if (task(id)) save();
            if (!file.demo) void fileStore("delete", file.id).catch(() => {});
            refreshActivity(id);
            toast("Файл убран из задачи");
            break;
          }
          case "reset-demo":
            modal(
              "Сбросить пример?",
              '<p style="font-size:12px;color:#7d8ca3">Изменения в этом макете будут заменены исходными демонстрационными данными.</p>',
              '<button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-reset">Сбросить пример</button>',
              true,
            );
            break;
          case "confirm-reset":
            closeDrawer();
            for (const t of model.tasks)
              for (const f of t.attachments || [])
                if (!f.demo) void fileStore("delete", f.id).catch(() => {});
            model = structuredClone(seed);
            for (const t of model.tasks)
              t.comments.forEach((c, index) => {
                c.id ||= `${t.id}-note-${index}`;
                c.kind ||= "comment";
              });
            ui.quick = null;
            ui.noteDrafts = {};
            ui.project = "all";
            ui.projects = [];
            ui.from = ui.to = "";
            ui.dateMode = "overlap";
            ui.filterDraft = null;
            ui.responsible = ui.executor = ui.status = ui.due = ui.q = "";
            ui.done = false;
            ui.expand = true;
            ui.view = "table";
            ui.manager = "projects";
            ui.managerArchived = false;
            ui.collapsed.clear();
            ui.closedProjects.clear();
            $("#search").value = "";
            save();
            closeModal();
            closeDrawer();
            render();
            $("#project-list").scrollTop = 0;
            $("#main-scroll").scrollTop = 0;
            toast("Пример восстановлен");
            break;
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.closest("#meeting-root")) meetingControl(event);
      });
      document.addEventListener("change", (event) => {
        if (
          event.target.closest("#meeting-root") &&
          event.target.tagName !== "INPUT"
        )
          meetingControl(event);
      });
      window.addEventListener("afterprint", () =>
        document.body.classList.remove("meeting-print"),
      );
      window.addEventListener("resize", () => {
        if (meeting) fitMeetingPreview();
      });
      document.addEventListener("input", (event) => {
        const composer = event.target.closest(".note-composer");
        if (composer)
          ui.noteDrafts[`${composer.dataset.scope}:${composer.dataset.task}`] =
            {
              kind: composer.querySelector(".note-kind").value,
              text: composer.querySelector(".note-text").value,
            };
      });
      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-upload-task]")) {
          void uploadFiles(event.target);
          return;
        }
        const composer = event.target.closest(".note-composer");
        if (composer)
          ui.noteDrafts[`${composer.dataset.scope}:${composer.dataset.task}`] =
            {
              kind: composer.querySelector(".note-kind").value,
              text: composer.querySelector(".note-text").value,
            };
        if (event.target.id === "task-kind") updateEventFields();
        const id = event.target.id,
          value = event.target.value;
        if (id === "show-done") {
          ui.done = event.target.checked;
          if (ui.filterDraft) ui.filterDraft.showDone = ui.done;
          render();
        }
        if (id === "expand-all") {
          ui.expand = event.target.checked;
          ui.collapsed.clear();
          render();
        }
        if (id === "manager-archived") {
          ui.managerArchived = event.target.checked;
          renderDirectory();
        }
        if (id === "task-parent") {
          const parent = task(value);
          $("#task-project").disabled = !!parent;
          if (parent) $("#task-project").value = parent.project;
        }
        if (id === "task-project") {
          const selected = ui.drawer.id ? descendants(ui.drawer.id) : new Set();
          $("#task-parent").innerHTML =
            '<option value="">Самостоятельная задача</option>' +
            model.tasks
              .filter((t) => t.project === value && !selected.has(t.id))
              .map((t) => `<option value="${E(t.id)}">${E(t.title)}</option>`)
              .join("");
        }
        if (id === "existing-contact") {
          $("#directory-name").disabled = !!value;
        }
      });
      $("#search").addEventListener("input", (event) => {
        ui.q = event.target.value;
        if (ui.filterDraft) ui.filterDraft.text = ui.q;
        renderContent();
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "task-form") {
          event.preventDefault();
          saveTask(event.target);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          meeting &&
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "p"
        ) {
          event.preventDefault();
          printMeeting();
          return;
        }
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing &&
          event.target.matches(".note-text")
        ) {
          event.preventDefault();
          postNote(event.target.closest(".note-composer"));
          return;
        }
        if (event.key === "Escape") {
          if (meeting) {
            closeMeeting();
            return;
          }
          if ($("#modal-root").children.length) closeModal();
          else closeDrawer();
          $("#popup-root").innerHTML = "";
        }
        if (
          event.key === "/" &&
          !meeting &&
          !["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement.tagName,
          )
        ) {
          event.preventDefault();
          $("#search").focus();
        }
        if (event.key === "Tab") {
          const container =
            $("#meeting-root .meeting-workspace") ||
            $("#modal-root .modal") ||
            $("#drawer-root .drawer");
          if (container) {
            const inputs = [
              ...container.querySelectorAll("button,input,select,textarea"),
            ].filter((e) => !e.disabled && e.offsetParent !== null);
            const first = inputs[0],
              last = inputs.at(-1);
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last?.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first?.focus();
            }
          }
        }
      });
      render();
    </script>
